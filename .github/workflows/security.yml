name: Security scans
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r flaskapp/requirements.txt
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local image for scan
        run: docker build -t bucketlist:security ./flaskapp
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: bucketlist:security
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
